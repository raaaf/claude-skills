<!doctype html>
<!--
  Single scene canvas for store stills. All brand values (fonts, colors,
  logo, screen image, copy) arrive as query params from bin/render.mjs,
  resolved to absolute file:// paths for anything that lives in the target
  project -- this file itself never hardcodes a project value (SKILL.md
  "Conventions": no brand values in the skill).

  Layout: classic upright screenshot (headline, then subline, then an
  upright device below, horizontally centered, running off the bottom
  edge). Ported from the orchestrator's approved prototype (2026-09-27
  REVISE round 1) after the user rejected the tilted-panorama look.

  Device frames are intentionally minimal (a rounded-corner screen
  container only, `.dev[data-device]` as the slot) per the same round's
  follow-up: realistic bezels/status bars are rejected too and will be
  replaced by real bezel-image overlays in a later round. Do not add
  status-bar icons, buttons, notch/punch-hole art, or nav pills here.

  Query params:
    format          ios-6.9 | play-phone | play-feature (selects width/height + layout branch)
    width, height   canvas pixel size (must match `format`'s size in store-specs.md)
    bg, fg          background / foreground (text) hex color for this scene
    headlineFont    absolute file:// path to the headline @font-face source
    headlineFamily  font-family name used in @font-face + headline element
    sublineFont     absolute file:// path to the subline @font-face source
    sublineFamily   font-family name used in @font-face + subline element
    headline        headline copy
    subline         subline copy (play-feature omits it, logo + headline only)
    logoSrc         absolute file:// path to the logo asset
    device          iphone | android | none (none on play-feature: no device shown)
    screenSrc       absolute file:// path to the source screen PNG
    cropTopPx       px to hide from the top of the screenshot (header/status bar),
                    calibrated against a 1320px-wide canvas and scaled linearly for
                    other canvas widths (references/config-schema.md "crop_top_px")
-->
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        overflow: hidden;
        font-family: 'Inter Variable', system-ui, sans-serif;
      }
      #canvas {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      #logo {
        height: 6%;
        margin-top: calc(var(--h) * 0.06);
      }
      #headline {
        font-weight: 400;
        line-height: 1.02;
        text-align: center;
        text-wrap: balance;
        margin: calc(var(--h) * 0.03) 7% 0;
        font-size: calc(var(--w) * 0.1);
      }
      #subline {
        font-weight: 500;
        line-height: 1.3;
        text-align: center;
        text-wrap: balance;
        opacity: 0.78;
        margin: calc(var(--w) * 0.033) 10% 0;
        font-size: calc(var(--w) * 0.041);
      }
      /* Minimal device slot: a rounded-corner screen container only. No
         bezel, status bar, notch, punch-hole, buttons, or nav pill (see
         the file-level comment). `data-device` is the hook a later round
         swaps for a real bezel-image overlay.

         Positioned in normal flow (not absolute with a fixed top offset)
         so it always follows the headline/subline regardless of how many
         lines they wrap to -- a fixed percentage offset let a 3-line
         headline push the subline down far enough that the device (opaque,
         painted on top since it would otherwise need its own stacking
         context) covered the subline entirely. #canvas's flex column
         still centers it horizontally; the device's own aspect ratio
         naturally runs it off the bottom edge (#canvas is overflow:hidden). */
      #device {
        width: var(--device-width);
        margin-top: calc(var(--h) * 0.02);
      }
      #device .screen {
        position: relative;
        overflow: hidden;
        background: #fff;
        border-radius: 6%;
        aspect-ratio: var(--device-ar);
      }
      #device .screen img {
        position: absolute;
        left: 0;
        width: 100%;
        top: calc(var(--crop-scaled) * -1);
      }
      #device[data-device='iphone'] {
        --device-width: 76%;
        --device-ar: 440 / 956;
      }
      #device[data-device='android'] {
        --device-width: 70%;
        --device-ar: 1280 / 2856;
      }
      body.landscape #device {
        display: none;
      }
      body.landscape #canvas {
        align-items: flex-start;
      }
      body.landscape #logo {
        margin: calc(var(--h) * 0.08) 0 0 6%;
      }
      body.landscape #headline {
        margin: calc(var(--h) * 0.09) 0 0 6%;
        width: 70%;
        text-align: left;
        /* play-feature's canvas is short and wide (1024x500), unlike the
           portrait formats this font-size formula was tuned for: sizing off
           --w here would overflow the 500px height, so landscape sizes off
           --h instead, with a wider column so the headline wraps to fewer
           lines. */
        font-size: calc(var(--h) * 0.16);
      }
    </style>
  </head>
  <body>
    <div id="canvas">
      <img id="logo" alt="" />
      <h1 id="headline"></h1>
      <p id="subline"></p>
      <div id="device">
        <div class="screen"><img alt="" /></div>
      </div>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const get = (key, fallback) => params.get(key) ?? fallback;

      const format = get('format', 'ios-6.9');
      const width = Number(get('width', 1320));
      const height = Number(get('height', 2868));
      const isLandscape = format === 'play-feature';

      document.documentElement.style.setProperty('--w', width + 'px');
      document.documentElement.style.setProperty('--h', height + 'px');
      document.documentElement.style.width = width + 'px';
      document.documentElement.style.height = height + 'px';
      document.body.style.width = width + 'px';
      document.body.style.height = height + 'px';
      document.body.style.background = get('bg', '#04081f');
      document.body.style.color = get('fg', '#ffffff');
      if (isLandscape) document.body.classList.add('landscape');

      const headlineFamily = get('headlineFamily', 'Holdstone');
      const sublineFamily = get('sublineFamily', 'Inter Variable');
      const headlineFontUrl = get('headlineFont', '');
      const sublineFontUrl = get('sublineFont', '');

      const fontStyle = document.createElement('style');
      fontStyle.textContent = `
        @font-face {
          font-family: "${headlineFamily}";
          src: url("${headlineFontUrl}") format("woff2");
          font-weight: 400;
          font-style: normal;
        }
        @font-face {
          font-family: "${sublineFamily}";
          src: url("${sublineFontUrl}") format("woff2");
          font-weight: 400 700;
          font-style: normal;
        }
      `;
      document.head.appendChild(fontStyle);

      document.getElementById('logo').src = get('logoSrc', '');

      const headlineEl = document.getElementById('headline');
      headlineEl.textContent = get('headline', '');
      headlineEl.style.fontFamily = `"${headlineFamily}", system-ui, sans-serif`;

      const sublineEl = document.getElementById('subline');
      if (isLandscape) {
        sublineEl.remove();
      } else {
        sublineEl.textContent = get('subline', '');
        sublineEl.style.fontFamily = `"${sublineFamily}", system-ui, sans-serif`;
      }

      if (isLandscape) {
        document.getElementById('device').remove();
      } else {
        const device = get('device', 'iphone');
        const deviceEl = document.getElementById('device');
        deviceEl.dataset.device = device;
        deviceEl.querySelector('img').src = get('screenSrc', '');

        // Reference canvas width the crop_top_px config value is
        // calibrated against (ios-6.9's 1320px); scales linearly for
        // other canvas widths (play-phone's 1440px), per this file's
        // header comment.
        const cropTopPx = Number(get('cropTopPx', 0));
        deviceEl.style.setProperty('--crop-scaled', `calc(${cropTopPx}px * (var(--w) / 1320px))`);
      }

      // Render readiness contract for bin/render.mjs: fonts must be the
      // requested family, never a silent fallback (SKILL.md Edge Cases:
      // "Font lädt nicht"). play-feature never renders a subline (isLandscape
      // removes #subline above), so the browser never fetches that font
      // file and document.fonts.check would always report it unloaded --
      // only checked when the subline is actually on the page.
      document.fonts.ready.then(() => {
        const headlineLoaded = document.fonts.check(`16px "${headlineFamily}"`);
        const sublineLoaded = isLandscape || document.fonts.check(`16px "${sublineFamily}"`);
        document.body.dataset.ready = headlineLoaded && sublineLoaded ? 'true' : 'font-failed';
      });
    </script>
  </body>
</html>
