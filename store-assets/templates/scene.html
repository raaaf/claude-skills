<!doctype html>
<!--
  Single scene canvas for store stills. All brand values (fonts, colors,
  logo, screen image, copy) and all device-asset paths (bezels, status-bar
  overlays, sampled colors) arrive as query params from bin/render.mjs,
  resolved against references/store-specs.md's "Devices" JSON there -- this
  file itself never hardcodes a machine path or a project value (SKILL.md
  "Conventions").

  Layout (2026-09-27 REVISE round 2, real device bezels; round 3 added the
  compact text zone + the play-feature device): fixed text zone (top 28% of
  the canvas height, headline + optional subline + optional pills
  vertically centered inside it; the headline shrinks in 4px steps to a
  40px floor if it overflows), then a device (or two, `layout=combo`) whose
  top edge is fixed at 30% of the canvas height (26% when the text zone is
  compact, see `.compact-hd`), running off the bottom edge. A scene with no
  subline and no pills gets an auto-height text zone instead (`.compact-hd`)
  and a larger headline ceiling (0.12 instead of 0.1). Device frames are
  real bezel PNGs + real status-bar capture overlays (store-specs.md
  "Devices"), not CSS-drawn approximations (superseded from round 1).
  play-feature (landscape) can also show one device on the right, sized off
  canvas height instead of width (see the `front`/`deviceSpec` handling in
  the `isLandscape` branch).

  Query params:
    format, width, height     canvas selection (as before)
    bg, fg                    this scene's background/foreground (also drives the
                               radial+linear gradient background)
    headlineFont/Family       headline @font-face
    sublineFont/Family        subline @font-face
    headline                  headline copy (required)
    subline                   subline copy (optional, omitted entirely when empty)
    pill1, pill2               optional badge copy (both omitted when empty)
    layout                    single | combo (default single)
    device                    iphone | android (device kind, shared by both phones in combo)
    deviceSpec                JSON: {w,h,sx,sy,sw,sh,r,sb,widthPct} from store-specs.md "Devices"
                               (w/h = bezel pixel size, sx/sy/sw/sh = screen rect, r = corner
                               radius, sb = status-bar band height, widthPct = device width as a
                               percent of the canvas)
    screenSrc/cropTopPx/topColor/statusBarTheme/bezelSrc/statusBarSrc/maskSrc
                               layout=single: this phone's resolved asset paths + sampled state
    front / back              layout=combo: JSON blobs with the same 7 fields per phone
-->
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        overflow: hidden;
        font-family: 'Inter Variable', system-ui, sans-serif;
        position: relative;
      }
      #hd {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: calc(var(--h) * 0.28);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding-top: calc(var(--h) * 0.02);
      }
      #headline {
        font-weight: 400;
        line-height: 1.02;
        text-align: center;
        text-wrap: balance;
        margin: 0 7%;
        font-size: calc(var(--w) * 0.1);
      }
      #subline {
        font-weight: 500;
        line-height: 1.3;
        text-align: center;
        text-wrap: balance;
        opacity: 0.8;
        margin: calc(var(--w) * 0.033) 10% 0;
        font-size: calc(var(--w) * 0.041);
      }
      .pills {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: calc(var(--w) * 0.015);
        margin-top: calc(var(--w) * 0.03);
      }
      /* events' own atoms.status-badge :on-image variant (rounded-full,
         border-white/30, bg-white/20, text-xs font-medium, backdrop-blur-sm),
         scaled x3.17 for App-Store-screenshot resolution. */
      .pill {
        color: #fff;
        font-weight: 500;
        line-height: 1.33;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.2);
        border: calc(var(--w) * 0.0024) solid rgba(255, 255, 255, 0.3);
        backdrop-filter: blur(calc(var(--w) * 0.0096));
        padding: calc(var(--w) * 0.0048) calc(var(--w) * 0.024);
        font-size: calc(var(--w) * 0.0288);
      }
      /* Position + transform are always set inline by the script below (a
         single-device slot centers via translateX(-50%), a combo slot uses
         an explicit left/top instead); only transform-origin stays here,
         since it differs by layout and never changes at render time.
         --device-top-pct: 0.30 normally, 0.26 when the text zone is
         compact (no subline/pills, see .compact-hd below). */
      .phone-slot {
        position: absolute;
        top: calc(var(--h) * var(--device-top-pct, 0.3));
        transform-origin: top center;
        filter: drop-shadow(0 calc(var(--w) * 0.03) calc(var(--w) * 0.06) rgba(0, 0, 0, 0.35));
      }
      .combo .phone-slot {
        transform-origin: top left;
      }
      .device-box {
        position: relative;
      }
      .device-box .bezel {
        position: absolute;
        left: 0;
        top: 0;
      }
      .device-box .screen {
        position: absolute;
        overflow: hidden;
      }
      .device-box .screen img.shot {
        position: absolute;
        left: 0;
        width: 100%;
      }
      .device-box .screen .band {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      .device-box .screen img.statusbar {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      .device-box .mask {
        position: absolute;
      }
      /* Compact text zone: when a scene has no subline and no pills (so
         far only the headline-only hero combo), the fixed 28% zone leaves
         too much empty space above the phones. Falls back to auto height
         (fits just the headline) and lets the headline grow past its
         normal 0.1 factor, up to 0.12 (both set via JS, never hardcoded to
         a specific scene id -- see the "no subline && no pills" check
         below). */
      body.compact-hd #hd {
        height: auto;
        padding-bottom: calc(var(--h) * 0.02);
      }
      body.compact-hd #headline {
        font-size: calc(var(--w) * 0.12);
      }
      body.landscape #hd {
        height: auto;
        align-items: flex-start;
        justify-content: flex-start;
      }
      body.landscape #logo {
        margin: calc(var(--h) * 0.08) 0 0 6%;
        /* Percent height would resolve against #hd's own height, which is
           auto in landscape (unlike the portrait 28% text zone) and so
           never resolves -- sized off --h directly instead. */
        height: calc(var(--h) * 0.06);
      }
      body.landscape #headline {
        margin: calc(var(--h) * 0.1) 0 0 6%;
        width: 70%;
        text-align: left;
        font-size: calc(var(--h) * 0.16);
      }
      #logo {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="hd">
      <img id="logo" alt="" />
      <h1 id="headline"></h1>
      <p id="subline"></p>
      <div class="pills" id="pills"></div>
    </div>
    <div id="devices"></div>
    <script>
      const params = new URLSearchParams(location.search);
      const get = (key, fallback) => params.get(key) ?? fallback;
      const getJSON = (key) => {
        const raw = params.get(key);
        return raw ? JSON.parse(raw) : null;
      };

      const format = get('format', 'ios-6.9');
      const width = Number(get('width', 1320));
      const height = Number(get('height', 2868));
      const isLandscape = format === 'play-feature';
      const layout = get('layout', 'single');
      const bg = get('bg', '#04081f');
      const fg = get('fg', '#ffffff');

      document.documentElement.style.setProperty('--w', width + 'px');
      document.documentElement.style.setProperty('--h', height + 'px');
      document.documentElement.style.width = width + 'px';
      document.documentElement.style.height = height + 'px';
      document.body.style.width = width + 'px';
      document.body.style.height = height + 'px';
      document.body.style.color = fg;
      document.body.style.background = isLandscape
        ? bg
        : `radial-gradient(85% 40% at 50% 60%, color-mix(in oklch, ${bg}, white 12%) 0%, transparent 70%), ` +
          `linear-gradient(180deg, color-mix(in oklch, ${bg}, white 5%) 0%, ${bg} 50%, color-mix(in oklch, ${bg}, black 14%) 100%)`;
      if (isLandscape) document.body.classList.add('landscape');
      if (layout === 'combo') document.body.classList.add('combo');

      const headlineFamily = get('headlineFamily', 'Holdstone');
      const sublineFamily = get('sublineFamily', 'Inter Variable');
      const fontStyle = document.createElement('style');
      fontStyle.textContent = `
        @font-face { font-family: "${headlineFamily}"; src: url("${get('headlineFont', '')}") format("woff2"); font-weight: 400; font-style: normal; }
        @font-face { font-family: "${sublineFamily}"; src: url("${get('sublineFont', '')}") format("woff2"); font-weight: 400 700; font-style: normal; }
      `;
      document.head.appendChild(fontStyle);

      const headlineEl = document.getElementById('headline');
      headlineEl.textContent = get('headline', '');
      headlineEl.style.fontFamily = `"${headlineFamily}", system-ui, sans-serif`;

      const subline = get('subline', '');
      const sublineEl = document.getElementById('subline');
      if (subline) {
        sublineEl.textContent = subline;
        sublineEl.style.fontFamily = `"${sublineFamily}", system-ui, sans-serif`;
      } else {
        sublineEl.remove();
      }

      const pill1 = get('pill1', '');
      const pill2 = get('pill2', '');
      const hasPills = Boolean(pill1 || pill2);
      const pillsEl = document.getElementById('pills');
      if (hasPills) {
        for (const text of [pill1, pill2]) {
          if (!text) continue;
          const span = document.createElement('span');
          span.className = 'pill';
          span.textContent = text;
          pillsEl.appendChild(span);
        }
      } else {
        pillsEl.remove();
      }

      // Compact text zone (no events-specific values, only "does this scene
      // have a subline or pills"): a headline-only scene starts the phones
      // 4 percentage points higher, since the fixed 28%/30% pair was tuned
      // for a headline+subline+optional-pills block.
      const isCompact = !isLandscape && !subline && !hasPills;
      if (isCompact) document.body.classList.add('compact-hd');
      const devicePct = isCompact ? 0.26 : 0.3;
      document.documentElement.style.setProperty('--device-top-pct', devicePct);

      // Builds one phone's DOM: bezel + screen (screenshot, sampled-color
      // backfill strip, real status-bar overlay) + optional mask overlay
      // (Android's corners+punch-hole). Stack order per store-specs.md
      // "Devices": iPhone paints the screen first then the bezel on top
      // (screen_over_bezel); Android paints the bezel first, the screen
      // on top, then the mask on top of that.
      function buildDeviceBox(spec, deviceKind, deviceSpec) {
          const box = document.createElement('div');
          box.className = 'device-box';
          box.style.width = deviceSpec.w + 'px';
          box.style.height = deviceSpec.h + 'px';

          const bezel = document.createElement('img');
          bezel.className = 'bezel';
          bezel.src = spec.bezelSrc;
          bezel.style.width = deviceSpec.w + 'px';

          const screen = document.createElement('div');
          screen.className = 'screen';
          screen.style.left = deviceSpec.sx + 'px';
          screen.style.top = deviceSpec.sy + 'px';
          screen.style.width = deviceSpec.sw + 'px';
          screen.style.height = deviceSpec.sh + 'px';
          screen.style.borderRadius = deviceSpec.r + 'px';
          screen.style.background = spec.topColor;

          const shot = document.createElement('img');
          shot.className = 'shot';
          shot.src = spec.screenSrc;
          shot.style.top = deviceSpec.sb - spec.cropTopPx + 'px';
          screen.appendChild(shot);

          const band = document.createElement('div');
          band.className = 'band';
          band.style.height = deviceSpec.sb + 'px';
          band.style.background = spec.topColor;
          screen.appendChild(band);

          const statusBar = document.createElement('img');
          statusBar.className = 'statusbar';
          statusBar.src = spec.statusBarSrc;
          screen.appendChild(statusBar);

          const mask = spec.maskSrc
            ? (() => {
                const m = document.createElement('img');
                m.className = 'mask';
                m.src = spec.maskSrc;
                m.style.left = deviceSpec.sx + 'px';
                m.style.top = deviceSpec.sy + 'px';
                m.style.width = deviceSpec.sw + 'px';
                m.style.height = deviceSpec.sh + 'px';
                return m;
              })()
            : null;

          if (deviceSpec.screenOverBezel) {
            box.appendChild(screen);
            box.appendChild(bezel);
          } else {
            box.appendChild(bezel);
            box.appendChild(screen);
            if (mask) box.appendChild(mask);
          }
          return box;
        }

      const device = get('device', 'iphone');
      const deviceSpec = getJSON('deviceSpec');
      const devicesEl = document.getElementById('devices');

      if (isLandscape) {
        document.getElementById('logo').src = get('logoSrc', '');
        document.getElementById('logo').style.display = 'block';
        // play-feature's right half is otherwise empty: an optional single
        // device (the hero's front phone, Pixel-framed) sized off canvas
        // height, cropped off the bottom, tucked to the right edge. Only
        // rendered when bin/render.mjs actually supplies one (a project
        // without a combo hero simply gets no device here, same as before).
        const front = getJSON('front');
        if (front && deviceSpec) {
          const scale = (height * 1.2) / deviceSpec.h;
          const slot = document.createElement('div');
          slot.className = 'phone-slot';
          slot.style.right = 'calc(var(--w) * -0.08)';
          slot.style.top = height * 0.18 + 'px';
          slot.style.transformOrigin = 'top right';
          slot.style.transform = `scale(${scale}) rotate(-6deg)`;
          slot.appendChild(buildDeviceBox(front, device, deviceSpec));
          devicesEl.appendChild(slot);
        } else {
          devicesEl.remove();
        }
      } else if (layout === 'combo') {
        // Fixed compositional constants for the two-phone hero (not a
        // brand value: purely how this one layout is art-directed).
        // Order matters: back appended first (painted behind), front
        // second (painted on top), matching the approved prototype.
        const comboWidthPct = 64;
        const back = getJSON('back');
        const front = getJSON('front');
        const scale = width * (comboWidthPct / 100) / deviceSpec.w;

        const backSlot = document.createElement('div');
        backSlot.className = 'phone-slot';
        backSlot.style.left = width * 0.42 + 'px';
        backSlot.style.top = height * devicePct + height * 0.059 + 'px';
        backSlot.style.transform = `scale(${scale}) rotate(7deg)`;
        backSlot.appendChild(buildDeviceBox(back, device, deviceSpec));

        const frontSlot = document.createElement('div');
        frontSlot.className = 'phone-slot';
        frontSlot.style.left = width * -0.04 + 'px';
        frontSlot.style.top = height * devicePct + 'px';
        frontSlot.style.transform = `scale(${scale}) rotate(-5deg)`;
        frontSlot.appendChild(buildDeviceBox(front, device, deviceSpec));

        devicesEl.appendChild(backSlot);
        devicesEl.appendChild(frontSlot);
      } else {
        const single = {
          screenSrc: get('screenSrc', ''),
          cropTopPx: Number(get('cropTopPx', 0)),
          topColor: get('topColor', '#000000'),
          bezelSrc: get('bezelSrc', ''),
          statusBarSrc: get('statusBarSrc', ''),
          maskSrc: get('maskSrc', '') || null,
        };
        const scale = (width * (deviceSpec.widthPct / 100)) / deviceSpec.w;
        const slot = document.createElement('div');
        slot.className = 'phone-slot';
        slot.style.left = '50%';
        slot.style.transform = `translateX(-50%) scale(${scale})`;
        slot.appendChild(buildDeviceBox(single, device, deviceSpec));
        devicesEl.appendChild(slot);
      }

      // Render readiness contract for bin/render.mjs: fonts must be the
      // requested family, never a silent fallback (SKILL.md Edge Cases:
      // "Font lädt nicht"). play-feature never renders a subline, so the
      // browser never fetches that font file and the check would always
      // fail; only checked when the subline is actually on the page.
      document.fonts.ready.then(() => {
        const headlineLoaded = document.fonts.check(`16px "${headlineFamily}"`);
        const sublineLoaded = !subline || document.fonts.check(`16px "${sublineFamily}"`);

        // Headline overflow: shrink in 4px steps down to a 40px floor.
        const hd = document.getElementById('hd');
        let f = parseFloat(getComputedStyle(headlineEl).fontSize);
        while (hd.scrollHeight > hd.clientHeight && f > 40) {
          f -= 4;
          headlineEl.style.fontSize = f + 'px';
        }

        document.body.dataset.ready = headlineLoaded && sublineLoaded ? 'true' : 'font-failed';
      });
    </script>
  </body>
</html>
