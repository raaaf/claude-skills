<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 620" width="300" height="620">
  <!-- Frame-only bezel, no vendor marketing asset. The viewport window (the
       hole in the middle) is transparent; scene.html positions the screen
       PNG behind this SVG so it shows through the window. Window rect,
       used by scene.html to align the screen image: x=10 y=10 w=280 h=600,
       corner radius 18 (Android's flatter corners vs. the iPhone frame). -->
  <path
    fill="#1b1b1d"
    fill-rule="evenodd"
    d="M 24 0
       H 276
       C 289.3 0 300 10.7 300 24
       V 596
       C 300 609.3 289.3 620 276 620
       H 24
       C 10.7 620 0 609.3 0 596
       V 24
       C 0 10.7 10.7 0 24 0
       Z
       M 24 10
       H 276
       C 283.7 10 290 16.3 290 24
       V 596
       C 290 603.7 283.7 610 276 610
       H 24
       C 16.3 610 10 603.7 10 596
       V 24
       C 10 16.3 16.3 10 24 10
       Z" />
  <rect x="10" y="10" width="280" height="600" rx="18" fill="none" />
  <circle cx="150" cy="24" r="4" fill="#1b1b1d" />
</svg>
