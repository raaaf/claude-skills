       H 44
       C 19.7 620 0 600.3 0 576
       V 44
       C 0 19.7 19.7 0 44 0
       Z
       M 44 14
       H 256
       C 272.6 14 286 27.4 286 44
       V 576
       C 286 592.6 272.6 606 256 606
       H 44
       C 27.4 606 14 592.6 14 576
       V 44
       C 14 27.4 27.4 14 44 14
       Z" />
  <rect x="14" y="14" width="272" height="592" rx="30" fill="none" />
  <rect x="120" y="24" width="60" height="18" rx="9" fill="#111114" />
</svg>
