; zz-screens.ini: /screens server-side fixed clock (repo CLAUDE.md
; "Isolation and lifecycle", "Server-side fixed clock").
;
; Instantiated into `<project>/.screens/web/php/zz-screens.ini` by the
; Phase 2 scaffold executor, which replaces {{PROJECT_ROOT}} with the
; pilot's absolute path (an ini directive needs an absolute path; it is not
; resolved relative to the project). Loaded only via `PHP_INI_SCAN_DIR`
; (screens.mjs's `phpFixedClockEnv`), never the project's own php.ini scan
; dir, so a normal dev request never sees it. The `zz` prefix keeps this
; last in scan order, matching PHP's alphabetical .ini scan.
auto_prepend_file={{PROJECT_ROOT}}/.screens/web/fixed-clock.php
