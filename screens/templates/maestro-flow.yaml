# maestro-flow.yaml: reference shape for ONE (entry, state, role) capture,
# instantiated by `.screens/android/generate-maestro-flows.mjs`
# (screens/references/platform-maestro.md) into an ephemeral flow file under
# `.screens/.maestro-generated/` -- never used unmodified, never committed
# (same "generated at runtime" relationship the web driver has to
# capture.spec.ts: the manifest is read by the GENERATOR, not by this file,
# so this template never hard-codes any project's views, repo CLAUDE.md
# "Reviewer" note).
#
# {{PLACEHOLDER}} tokens are replaced with real values by the generator.
# Comments describe what each block does; the generator drops a block
# entirely when its manifest field is empty (e.g. no error_fill -> no
# "state: error" input block).

appId: {{APP_ID}}
---
# clearState is true only for the FIRST entry captured for a given role
# (`{{CLEAR_STATE}}`, generator's `roleSeen` tracking): a fresh app install
# once per role, not once per (entry, state, role) -- an `openLink`-era
# `clearState: true` on every flow forced a full relogin per entry, and
# `openLink` itself resolves an implicit VIEW intent that Android routes to
# Chrome (the app's own App Link intent-filter only verifies the production
# host, never the isolated backend host `server.url` is pointed at, live
# STOP 2026-09-24). Navigation for an entry with a `reach` URL now happens
# BEFORE this flow even starts: the driver sends an explicit-component
# intent via `screens.mjs android-navigate` (platform-maestro.md
# "Explicit-intent navigation"), so `launchApp` here only brings the
# already-navigated app to the foreground.
- launchApp:
    clearState: {{CLEAR_STATE}}

# Login (state != "guest", first entry of the role only -- see
# `{{CLEAR_STATE}}` above; a later entry of the same role reuses the still-
# logged-in session instead of re-submitting the form): reuses the SAME web
# login form the Capacitor webview renders (plan step 9 context: "it wraps
# the Laravel web UI: reuse the web routes"), matched by the Laravel
# Breeze/Jetstream default input ids -- the same selectors capture.spec.ts's
# loginAs() targets via CSS, expressed here as Maestro webview element ids
# (verify against the real rendered login form during scaffold; a project
# with different ids sets `config.android.login_selectors`).
{{LOGIN_STEPS}}

# Reach: an entry with a `reach` URL is navigated externally before this
# flow runs (see `{{CLEAR_STATE}}` comment above), so no in-flow step is
# needed here. An entry with no `reach` (only reachable through a UI flow
# with no direct route) falls back to the shared native `steps[]`
# vocabulary (tap_tab/tap/wait/type/swipe_up/swipe_down, config-schema.md,
# same mapping the generator applies for the Apple driver's `steps[]`).
{{REACH_STEPS}}

# State axis "error" (entry.error_fill, same {selector, value} shape the
# web driver reads): fills the listed fields by id and submits.
{{ERROR_FILL_STEPS}}

# mask[] has no Maestro equivalent selector-hide mechanism for a webview
# element the way Playwright's `el.style.visibility = 'hidden'` does; the
# generator instead emits a `runScript` only when the webview exposes a
# `window.screensApplyMask` hook (see platform-maestro.md "Known limits"),
# otherwise this block is empty and the entry's masked regions stay live in
# the capture -- the same "no mask[] equivalent" limitation the Apple
# driver already documents for native views.
{{MASK_STEPS}}

# Settle before the shot: no global animation-disable exists for a webview
# the way Playwright's injected CSS does, so a fixed wait after the last
# navigation step is the guard against a mid-transition capture (same
# 0.8s-class margin the Apple driver's `perform(steps:)` uses). Matched by
# visible TEXT, not a CSS selector -- android/capacitor manifest entries set
# `ready` to human-visible text (e.g. the view's own heading), not a CSS
# selector the way web entries do (platform-maestro.md "Flow generation");
# the project's own `.maestro/*.yaml` flows already match this way
# exclusively, verified more robust than id-based webview matching here.
- extendedWaitUntil:
    visible:
      text: "{{READY_SELECTOR}}"
    timeout: 15000

# A bare name, not a path: Maestro writes `<name>.png` to the CURRENT
# WORKING DIRECTORY (verified against the events pilot's own pre-existing
# `.gitignore` comment: "Maestro takeScreenshot writes PNGs to the repo
# root on each run"), never an arbitrary target path. The driver invocation
# moves it into `.screens/.incoming/android/` after `maestro test` returns
# (platform-maestro.md "Invocation").
- takeScreenshot: {{SCREENSHOT_PATH}}
