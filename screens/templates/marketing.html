<!doctype html>
<!--
  marketing.html: App-Store-ready marketing render template for /screens
  (plan's "Marketing" section, quality-upgrade spec "browser"/"browser-phone"
  layouts). Placeholders ({{WIDTH}}, {{HEIGHT}}, {{BACKGROUND}}, {{HEADLINE}},
  {{DOMAIN}}, {{DESKTOP_SRC}}, {{FONT_FAMILY}}, {{FONT_FACE_CSS}},
  {{LOGO_BLOCK}}, {{PHONE_BLOCK}}) are string-replaced by
  `render-marketing.mjs` (instantiated into `.screens/web/render-marketing.mjs`)
  before Playwright screenshots this file at the store's exact pixel size.

  No external assets, no CDN, no JS framework: the browser window and iPhone
  frame are drawn entirely in CSS/inline SVG. {{PHONE_BLOCK}} is empty for the
  "browser" layout and a full iPhone-frame block for "browser-phone"
  (render-marketing.mjs decides which, screens.mjs's `resolveMarketingLayout`
  decides the per-entry layout).
-->
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  {{FONT_FACE_CSS}}
  html, body {
    width: {{WIDTH}}px;
    height: {{HEIGHT}}px;
    overflow: hidden;
    position: relative;
    background: {{BACKGROUND}};
    font-family: {{FONT_FAMILY}}, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* Subtle grain (Background spec: "very subtle noise/grain via inline SVG
     filter"): a flat gradient reads as a cheap SaaS template at this size. */
  .grain { position: absolute; inset: 0; opacity: 0.05; pointer-events: none; mix-blend-mode: overlay; }

  .logo { position: absolute; top: 88px; left: 50%; transform: translateX(-50%); height: 40px; }
  .logo img { height: 100%; display: block; }

  h1 {
    position: absolute;
    top: 168px;
    left: 50%;
    transform: translateX(-50%);
    width: 1400px;
    font-size: 96px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.08;
    color: {{TEXT_COLOR}};
    text-align: center;
  }

  /* Depth (Background spec, round 2): the token gradient alone reads as flat
     black at this size, which swallows the dark toolbar's own shadow. A soft
     radial highlight behind the window lifts it off the stage without
     touching the brand gradient underneath. */
  .stage-highlight {
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 62%, {{HIGHLIGHT_COLOR}} 0%, transparent 60%);
    pointer-events: none;
  }

  /* Browser mockup: deliberately large and cropped off the bottom edge
     (Layout A spec), positioned close below the headline so the product
     dominates the frame. Light macOS toolbar (round 2): a dark toolbar on
     the dark brand gradient merged into the background, so the window no
     longer read as a bright, tappable object. */
  .browser-window {
    position: absolute;
    top: 350px;
    left: 50%;
    transform: translateX(-50%);
    width: 1650px;
    border-radius: 14px;
    overflow: hidden;
    background: #fff;
    border: 1px solid rgba(255, 255, 255, 0.10);
    box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .35), 0 10px 30px rgba(0, 0, 0, .15);
  }
  .browser-toolbar {
    height: 52px;
    display: flex;
    align-items: center;
    padding: 0 18px;
    gap: 20px;
    background: linear-gradient(#ECECEC, #E3E3E3);
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
  }
  .traffic-lights { display: flex; gap: 8px; }
  .traffic-lights span { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .traffic-lights .red { background: #FF5F57; }
  .traffic-lights .yellow { background: #FEBC2E; }
  .traffic-lights .green { background: #28C840; }
  .nav-glyphs { display: flex; gap: 12px; color: rgba(0, 0, 0, .45); }
  .nav-glyphs svg { width: 16px; height: 16px; }
  .url-pill {
    flex: 1;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    height: 30px;
    border-radius: 7px;
    background: #fff;
    border: 1px solid rgba(0, 0, 0, 0.08);
    color: #666;
    font-size: 13px;
  }
  .url-pill svg { width: 11px; height: 11px; opacity: .7; }
  .url-pill-spacer { width: 52px; }
  .browser-shot { display: block; width: 100%; object-fit: cover; object-position: top; }

  /* iPhone mockup ("browser-phone" layout only): a titanium-style bezel
     (near-black inner ring, a thin light rim highlight on the outer edge),
     dynamic island + a real status-bar zone above the app screenshot so the
     island sits over its own black status bar instead of over the app's own
     header, overlapping the browser window's lower right corner, also
     allowed to crop at the bottom edge. */
  .iphone-frame {
    position: absolute;
    right: 150px;
    top: 520px;
    width: 385px;
    border-radius: 55px;
    padding: 11px;
    background: linear-gradient(160deg, #4a4a4d 0%, #0c0c0d 55%, #000 100%);
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.12),
      inset 0 0 0 1.5px rgba(255, 255, 255, 0.08),
      0 30px 80px -20px rgba(0, 0, 0, .4), 0 10px 30px rgba(0, 0, 0, .2);
  }
  .iphone-screen { position: relative; border-radius: 46px; overflow: hidden; background: #000; }
  .phone-statusbar {
    position: relative;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    background: #fff;
    color: #000;
    font-size: 16px;
    font-weight: 600;
  }
  .phone-statusbar-glyphs { display: flex; align-items: center; gap: 6px; }
  .phone-statusbar-glyphs svg { height: 12px; display: block; }
  .iphone-screen img { display: block; width: 100%; object-fit: cover; object-position: top; }
  .dynamic-island {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    width: 90px; height: 26px; border-radius: 15px; background: #000; z-index: 2;
  }
  .iphone-side-button {
    position: absolute; right: -2px; top: 140px; width: 3px; height: 60px;
    border-radius: 2px; background: rgba(0, 0, 0, 0.3);
  }
  .iphone-side-button-left {
    position: absolute; left: -2px; top: 110px; width: 3px; height: 40px;
    border-radius: 2px; background: rgba(0, 0, 0, 0.3);
  }
</style>
</head>
<body>
  <div class="stage-highlight"></div>
  <svg class="grain" width="100%" height="100%">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>
  {{LOGO_BLOCK}}
  <h1>{{HEADLINE}}</h1>
  <div class="browser-window">
    <div class="browser-toolbar">
      <div class="traffic-lights"><span class="red"></span><span class="yellow"></span><span class="green"></span></div>
      <div class="nav-glyphs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
      </div>
      <div class="url-pill">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a4 4 0 00-4 4v3H7a1 1 0 00-1 1v9a1 1 0 001 1h10a1 1 0 001-1v-9a1 1 0 00-1-1h-1V6a4 4 0 00-4-4zm-2 7V6a2 2 0 114 0v3h-4z"/></svg>
        <span>{{DOMAIN}}</span>
      </div>
      <div class="url-pill-spacer"></div>
    </div>
    <img class="browser-shot" src="{{DESKTOP_SRC}}">
  </div>
  {{PHONE_BLOCK}}
</body>
</html>
